name: Create new dvmvocoder release

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Create Release
      id: create_release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release view ${{ github.ref_name }} || gh release create ${{ github.ref_name }}

  build-release:
    needs: create-release
    permissions:
      contents: write
    uses: ./.github/workflows/linux-windows-cmake-build.yml
    with:
      release: true
      release_tag: ${{ github.ref_name }}

  build-release-android:
    needs: create-release
    permissions:
      contents: write
    uses: ./.github/workflows/android-cmake-build.yml
    with:
      release: true
      release_tag: ${{ github.ref_name }}
